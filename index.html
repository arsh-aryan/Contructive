<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constructive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #f3f0ea; --panel: #fbfaf7; --ink: #23221f; --muted: #6d6a63; --rule: #e0dbd1;
    --accent: #0f8b8d; --fail: #b4472f; --warn: #a7791b; --ok: #3d7a4a;
    font-family: 'Noto Sans', 'Noto Sans Devanagari', system-ui, sans-serif; color: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; font-size: 13px; }
  header { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--panel); }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: .02em; }
  .brand small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }
  .spacer { flex: 1; }
  label.ctl { display: inline-flex; flex-direction: column; gap: 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  select { font: inherit; font-size: 13px; color: var(--ink); background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 4px 6px; text-transform: none; letter-spacing: 0; max-width: 100%; }
  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  #view { position: relative; min-height: 300px; }
  #view canvas { display: block; }
  .overlay { position: absolute; top: 12px; left: 12px; display: flex; gap: 10px; flex-wrap: wrap; background: rgba(251,250,247,.92); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; }
  .status { position: absolute; bottom: 12px; left: 12px; padding: 6px 10px; border-radius: 4px; font-weight: 600; background: #fff; border: 1px solid var(--rule); }
  .status.bad { color: var(--fail); border-color: var(--fail); }
  .status.good { color: var(--ok); border-color: var(--ok); }
  .chainage { position: absolute; bottom: 12px; right: 12px; color: var(--muted); font-size: 11px; background: rgba(251,250,247,.9); padding: 4px 8px; border-radius: 4px; }
  aside { border-left: 1px solid var(--rule); background: var(--panel); overflow-y: auto; }
  section { padding: 14px 16px; border-bottom: 1px solid var(--rule); }
  h2 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
  .obs { display: grid; grid-template-columns: 74px 1fr auto; gap: 2px 10px; padding: 7px 0; border-top: 1px dotted var(--rule); }
  .obs:first-of-type { border-top: 0; }
  .obs .ch { color: var(--muted); font-variant-numeric: tabular-nums; }
  .obs .meta { grid-column: 2 / 4; color: var(--muted); font-size: 11px; }
  .sev { font-size: 11px; font-weight: 600; }
  .sev.fails { color: var(--fail); } .sev.marginal { color: var(--warn); } .sev.ok { color: var(--ok); }
  .work { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px dotted var(--rule); }
  .work:first-of-type { border-top: 0; }
  .work .n { color: var(--muted); width: 18px; }
  .work .t { flex: 1; }
  .work button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 11px; text-decoration: underline; cursor: pointer; padding: 0; }
  .work button:hover { color: var(--fail); }
  .empty { color: var(--muted); font-style: italic; }
  .pickers { display: grid; gap: 6px; margin-bottom: 10px; }
  .pickers select { width: 100%; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { text-align: left; padding: 4px 0; border-top: 1px dotted var(--rule); font-weight: 400; }
  th { color: var(--muted); font-size: 11px; border-top: 0; }
  td.num, th.num { text-align: right; }
  .delta-good { color: var(--ok); } .delta-bad { color: var(--fail); }
  footer { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--rule); background: var(--panel); }
  footer .effects { flex: 1; min-width: 240px; }
  footer .effects b { font-weight: 600; }
  footer .cost { font-variant-numeric: tabular-nums; }
  .btn { font: inherit; background: var(--ink); color: #fff; border: 0; border-radius: 4px; padding: 7px 12px; cursor: pointer; }
  .btn:hover { background: var(--accent); }
  .disclaimer { color: var(--muted); font-size: 11px; padding: 10px 16px; }
  dialog { max-width: 760px; width: calc(100% - 32px); border: 1px solid var(--rule); border-radius: 6px; padding: 0; }
  dialog pre { margin: 0; padding: 20px; white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, monospace; max-height: 70vh; overflow: auto; }
  dialog .bar { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--rule); }
  @media (max-width: 860px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    #view { height: 55vh; }
    aside { border-left: 0; border-top: 1px solid var(--rule); }
  }
</style>
</head>
<body>
<header>
  <div class="brand">Constructive<small data-i18n="tagline"></small></div>
  <label class="ctl"><span data-i18n="ward"></span>
    <select id="ward"><option>14 · Sadar Bazaar (representative)</option></select></label>
  <label class="ctl"><span data-i18n="lane"></span>
    <select id="lane"><option>Gali 7 · 120 m</option></select></label>
  <div class="spacer"></div>
  <label class="ctl"><span data-i18n="viewingAs"></span><select id="role"></select></label>
  <label class="ctl">Language<select id="lang"><option value="en">English</option><option value="hi">हिन्दी</option></select></label>
</header>

<main>
  <div id="view">
    <div class="overlay">
      <label class="ctl"><span data-i18n="state"></span><select id="state"></select></label>
      <label class="ctl"><span data-i18n="scenario"></span><select id="scenario"></select></label>
    </div>
    <div id="status" class="status" hidden></div>
    <div class="chainage">Ch. 0 m ← → Ch. 120 m</div>
  </div>
  <aside>
    <section>
      <h2><span data-i18n="observations"></span><span id="obsCount"></span></h2>
      <div id="observations"></div>
    </section>
    <section>
      <h2><span data-i18n="works"></span></h2>
      <div class="pickers">
        <select id="addWork"></select>
        <select id="preset"></select>
      </div>
      <div id="works"></div>
    </section>
    <section>
      <h2><span id="metricsTitle"></span></h2>
      <table id="metrics"></table>
    </section>
    <section>
      <h2><span data-i18n="checks"></span></h2>
      <table id="checks"></table>
    </section>
    <div class="disclaimer" data-i18n="disclaimer"></div>
  </aside>
</main>

<footer>
  <div class="effects" id="effects"></div>
  <div class="cost" id="cost"></div>
  <button class="btn" id="exportDpr" data-i18n="exportDpr"></button>
</footer>

<dialog id="dpr"><pre id="dprText"></pre><div class="bar"><button class="btn" id="dprCopy">Copy</button><button class="btn" id="dprClose">Close</button></div></dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
